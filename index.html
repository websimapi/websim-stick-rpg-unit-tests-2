<body>
    <h1>Stick RPG - Development Test Suite</h1>

    <div id="mocha"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/9.2.2/mocha.min.js"></script>
    <script>
        // Configure Mocha to use the BDD interface. This will define `describe`, `it`, etc. globally.
        mocha.setup('bdd');
    </script>

    <script type="importmap">
    {
        "imports": {
            "chai": "https://esm.sh/chai@4.3.7",
            "src/player": "./src/player.js",
            "src/game": "./src/game.js"
        }
    }
    </script>

    <!-- Import test files as modules. They will now have access to the global mocha functions. -->
    <script type="module" src="./tests/player.test.js"></script>
    <script type="module" src="./tests/game.test.js"></script>

    <script type="module">
        // Run the tests after all test files have been loaded.
        mocha.run();
    </script>
