<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick RPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/9.2.2/mocha.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="test-view">
        <h1>Stick RPG - Development Test Suite</h1>
        <p>Below are the unit tests for the game. Our goal is to make them all pass! Once they do, you can play the game.</p>
        <div id="play-button-container" style="display: none;">
            <button id="play-game-btn">Play Game</button>
        </div>
    </div>

    <div id="mocha"></div>
    <div id="game-container" style="display: none;">
        <!-- Game will be rendered here -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/9.2.2/mocha.min.js"></script>
    <script>
        // Configure Mocha to use the BDD interface. This will define `describe`, `it`, etc. globally.
        mocha.setup('bdd');
    </script>

    <script type="importmap">
    {
        "imports": {
            "chai": "https://esm.sh/chai@4.3.7",
            "src/player": "./src/player.js",
            "src/game": "./src/game.js",
            "src/ui": "./src/ui.js"
        }
    }
    </script>

    <!-- Import test files as modules. They will now have access to the global mocha functions. -->
    <script type="module" src="./tests/player.test.js"></script>
    <script type="module" src="./tests/game.test.js"></script>
    <script type="module" src="./tests/ui.test.js"></script>

    <script type="module">
        // Run the tests after all test files have been loaded.
        const runner = mocha.run();

        runner.on('end', function() {
            // The `stats` object is available on the runner after the tests have completed.
            if (this.stats.failures === 0) {
                console.log('All tests passed! Enabling Play button...');
                
                // Update text and show play button
                const testView = document.getElementById('test-view');
                if (testView) {
                    testView.querySelector('p').textContent = 'All tests passed! Click the button below to play.';
                    const playButtonContainer = document.getElementById('play-button-container');
                    playButtonContainer.style.display = 'block';

                    const playGameBtn = document.getElementById('play-game-btn');
                    playGameBtn.addEventListener('click', () => {
                        // Hide test-related elements
                        testView.style.display = 'none';
                        document.getElementById('mocha').style.display = 'none';

                        // Show the game container and initialize the UI
                        const gameContainer = document.getElementById('game-container');
                        gameContainer.style.display = 'flex'; // Use flex to match game layout

                        if (!gameContainer.hasChildNodes()) { // Prevent re-initialization
                            import('./src/ui.js').then(({ initGameUI }) => {
                                initGameUI(gameContainer);
                            }).catch(err => console.error('Failed to load game UI:', err));
                        }
                    }, { once: true }); // Ensure the click event listener is only added and runs once
                }

            } else {
                const testView = document.getElementById('test-view');
                if (testView) {
                    testView.querySelector('h1').textContent = 'Stick RPG - Development Test Suite';
                    testView.querySelector('p').textContent = 'Fix the failing unit tests to play the game.';
                    document.getElementById('game-container').style.display = 'none';
                    document.getElementById('play-button-container').style.display = 'none';
                }
            }
        });
    </script>

</body>
</html>
